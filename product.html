<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goyu</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">
<div id="site-top"></div>
<main class="pd">
<nav class="pd-crumb" aria-label="현재 위치"><a href="shop.html">Shop</a><span aria-hidden="true">/</span><a id="crumb-cat" href="shop.html"></a></nav>

<div class="pd-top">
<section class="pd-gallery" aria-label="제품 이미지">
<div class="pd-main" id="pd-main"></div>
<button type="button" class="pd-arrow pd-arrow--prev" id="prev" aria-label="이전 이미지"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg></button>
<button type="button" class="pd-arrow pd-arrow--next" id="next" aria-label="다음 이미지"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="pd-count" id="pd-count"></div>
</section>

<section class="pd-info" aria-label="상품 정보">
<p class="pd-cat" id="pd-cat"></p>
<h1 class="pd-name" id="pd-name"></h1>
<p class="pd-en" id="pd-en" lang="en"></p>
<p class="pd-price" id="pd-price"></p>
<p class="pd-desc">goyu 자체 프리미엄 기능성 웨빙</p>

<dl class="pd-ship">
<div><dt>배송비</dt><dd>3,000원 (5만원 이상 무료배송)</dd></div>
<div><dt>출고</dt><dd>1-3일 소요</dd></div>
</dl>

<div class="pd-field">
<div class="pd-field__head"><span>컬러</span><span class="pd-field__value" id="pd-color-name"></span></div>
<div class="pd-swatches" id="pd-swatches"></div>
</div>

<div class="pd-field">
<div class="pd-field__head"><span>사이즈</span><a href="#pd-size" class="pd-link">사이즈 가이드</a></div>
<div class="pd-sizes" id="pd-sizes" role="group" aria-label="사이즈 선택"></div>
</div>

<div class="pd-field">
<div class="pd-field__head"><span>수량</span></div>
<div class="pd-qty">
<button type="button" id="qty-minus" aria-label="수량 빼기">−</button>
<output id="qty" aria-live="polite">1</output>
<button type="button" id="qty-plus" aria-label="수량 더하기">+</button>
</div>
</div>

<div class="pd-total"><span>총 상품 금액</span><strong id="pd-total">0원</strong></div>

<div class="pd-actions">
<button type="button" class="pd-btn" id="add-bag">ADD TO BAG</button>
<button type="button" class="pd-btn pd-btn--fill" id="buy-now">BUY IT NOW</button>
</div>
<button type="button" class="pd-npay" id="npay" aria-label="네이버페이 구매"><span class="pd-npay__n" aria-hidden="true">N</span><span class="pd-npay__pay">pay</span> 구매</button>

<div class="pd-set">
<p class="pd-set__title">함께 쓰면 좋은 세트</p>
<div class="pd-set__grid" id="pd-set"></div>
</div>
</section>
</div>

<div class="pd-tabs" role="tablist" aria-label="상품 상세 정보" id="pd-tabs"></div>
<section class="pd-panel" id="pd-panel" role="tabpanel"></section>

</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
